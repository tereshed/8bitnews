# Профиль канала 8BitNewsES. Формат — как у 8BitNewsUS (решение владельца 04.11.2026).
# YouTube: канал UCN5kz5l8wqiwlzDeMnRldDg.

id: 8bitnews-es
name: 8BitNewsES
country: ES
language: es-ES
timezone: Europe/Madrid

platforms:
  youtube:   { enabled: true, account: "@8BitNewsES" }
  # Владелец 09.11.2026: пока только YouTube. Аккаунтов TikTok и Instagram нет, Legal их правила не проверяет.
  tiktok:    { enabled: false, account: tbd }
  instagram: { enabled: false, account: tbd }

schedule:
  # Запуски конвейера в PolyMaths (cron в timezone канала). Один запуск = один ролик.
  # Владелец 11.11.2026: 5 роликов в день — обязательное условие. Запуски каждые 1,5 часа с 08:00 по Мадриду: прогон
  # идёт 1,5–2 часа, так что соседние почти не перекрываются, и сюжет предыдущего обычно уже сдан в hub, когда editor
  # следующего ищет свой (story_find_similar). Сюжет каждый запуск выбирает свободно (выбор владельца).
  runs: ["0 8 * * *", "30 9 * * *", "0 11 * * *", "30 12 * * *", "0 14 * * *"]
  # Слоты публикации (локальное время канала), по одному на ролик. hub берёт первый свободный не раньше чем через
  # 45 минут после одобрения, внутри дня в порядке списка: по часам, чтобы каждый ролик вышел в день сборки
  # (владелец 11.11.2026, вариант A). 21:00 — вечерний пик соцсетей в Испании, 14:00 — обед.
  publish_slots: ["11:00", "14:00", "17:00", "19:00", "21:00"]
  # День размышления и день выборов: ничего не выходит (countries/es/legal.md#election-allowed).
  publish_blackout: ["2026-11-28", "2026-11-29"]

moderation:
  # Владелец 09.11.2026: подтверждать каждый ролик не нужно, готовый сразу встаёт в расписание (docs/automation.md).
  approval_required: false

editorial:
  tone: calm, neutral, analytical; serious mode for deaths, violence and disasters (format.md)
  topics_include: []
  # Снять после 29.11.2026: до выборов первые ролики идут без предвыборных тем (operator/legal.md#es-elections).
  topics_exclude:
    - "General election of 29 November 2026: candidates, party campaigns and programmes, electoral polls, voting procedure"
    # Владелец 09.11.2026: ролики выходят без человека, а за обвинение отвечает оператор лично.
    - "Stories whose point is an accusation against a named person or company that no court has decided: criminal charges, investigations, lawsuits, allegations of misconduct, even from officials or official documents"

format:
  description: format.md
  aspect: "9:16"
  duration_s: { min: 45, max: 90 }
  # Все голоса на скорости 1,0 (выбор владельца 04.11.2026). Темп сильно зависит от текста: 162–181 слово в минуту,
  # в серьёзном режиме от 149. Бюджет считан по медленному концу, минимум — по быстрому.
  words: { rate: 2.5, min: 135, seconds_per_word: 0.37, serious_rate: 2.25, serious_min: 125, serious_seconds_per_word: 0.41 }
  templates: [nes-desk]
  default_template: nes-desk
  # Голос у каждого ведущего свой: voice_id в studio/channels/8bitnews-es/anchors/<id>/manifest.json.
  voice: { provider: kokoro }
  subtitles: burned_in

sources: countries/es/sources.yaml
policy: countries/es/policy.md

experiments:
  enabled: false
