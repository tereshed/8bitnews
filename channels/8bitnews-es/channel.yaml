# Профиль канала 8BitNewsES. Формат — как у 8BitNewsUS (решение владельца 04.11.2026).
# YouTube: канал UCN5kz5l8wqiwlzDeMnRldDg.

id: 8bitnews-es
name: 8BitNewsES
country: ES
language: es-ES
timezone: Europe/Madrid

platforms:
  youtube:   { enabled: true, account: "@8BitNewsES" }
  # Владелец 09.11.2026: пока только YouTube. Аккаунтов TikTok и Instagram нет, Legal их правила не проверяет.
  tiktok:    { enabled: false, account: tbd }
  instagram: { enabled: false, account: tbd }

schedule:
  # Запуски конвейера в PolyMaths (cron в timezone канала). Один запуск = один ролик.
  # Владелец 11.11.2026: 5 роликов в день — обязательное условие. Запуски каждые 1,5 часа с 08:00 по Мадриду: прогон
  # идёт 1,5–2 часа, так что соседние почти не перекрываются, и сюжет предыдущего обычно уже сдан в hub, когда editor
  # следующего ищет свой (story_find_similar). Сюжет каждый запуск выбирает свободно (выбор владельца).
  runs: ["0 8 * * *", "30 9 * * *", "0 11 * * *", "30 12 * * *", "0 14 * * *"]
  # Слоты публикации (локальное время канала), по одному на ролик. hub берёт первый свободный не раньше чем через
  # 45 минут после одобрения, внутри дня в порядке списка: по часам, чтобы каждый ролик вышел в день сборки
  # (владелец 11.11.2026, вариант A). 21:00 — вечерний пик соцсетей в Испании, 14:00 — обед.
  # ВРЕМЕННО, 11.11.2026: владелец «выпусти все сегодня по готовности, это исключение» — четыре дополнительных ролика
  # дня выходят сегодня вечером. Слоты 20:00, 22:00, 23:00, 23:30 стоят в конце списка: основные пять берутся первыми.
  # Убрать, когда все четыре встанут в расписание (слот за релизом закрепляется при одобрении).
  publish_slots: ["11:00", "14:00", "17:00", "19:00", "21:00", "20:00", "22:00", "23:00", "23:30"]
  # День размышления и день выборов: ничего не выходит (countries/es/legal.md#election-allowed).
  publish_blackout: ["2026-11-28", "2026-11-29"]

moderation:
  # Владелец 09.11.2026: подтверждать каждый ролик не нужно, готовый сразу встаёт в расписание (docs/automation.md).
  approval_required: false

editorial:
  tone: calm, neutral, analytical; serious mode for deaths, violence and disasters (format.md)
  # Фокус канала, владелец 24.11.2026: «давай сделаем фокус на этих темах, нам важно растить просмотры». Темы — по
  # роликам, которые лента Shorts продвинула за 05–22.11: масло (Almazaras), SMI, учения сил для Украины и осуждение удара
  # по больнице в Газе, Semaf, 1.488 спасённых у Канар, танкер у Ормуза. Это приоритет, а не фильтр (editor.md, п. 3):
  # нет подходящего кандидата из списка — editor берёт лучший из остальных.
  topics_include:
    - "Household money and daily life in Spain: food and fuel prices, wages and the minimum wage, rent and mortgages, taxes and benefits, new rules that change what people pay or must do"
    - "Spain's own move in a big international story: Spain sends, joins, condemns, vetoes or pays (missions, troops, Gaza, Ukraine, NATO, EU)"
    - "Attacks, sinkings, shoot-downs, explosions and other violent events of a war or armed conflict; disasters (serious mode)"
    - "Energy and supply shocks that reach Spain: oil and gas routes (Hormuz, Red Sea), tankers, blackouts, shortages"
    - "Migration by sea to the Canaries, the Balearics, Ceuta and Melilla: arrivals, records, rescues, emergencies"
    - "Strikes and transport disruption that hit people across Spain on the day they happen: trains, flights, metro, roads"
    - "From 30 November 2026: results of the 29 November general election and the forming of a government: official results and seats, pacts, investiture votes when they happen; not claims of irregularities without an official decision"
  # Выборы 29.11.2026 (владелец 24.11: «как лучше так и освещай»): до голосования без предвыборных тем
  # (operator/legal.md#es-elections), итоги — с 30.11. Строка действует только в свой срок, снимать её не нужно.
  topics_exclude:
    - "Until polls close at 21:00 Madrid time on 29 November 2026: the general election of 29 November 2026 — candidates, party campaigns and programmes, electoral polls, voting procedure. From 30 November 2026 this line no longer applies"
    # Владелец 09.11.2026: ролики выходят без человека, а за обвинение отвечает оператор лично.
    - "Stories whose point is an accusation against a named person or company that no court has decided: criminal charges, investigations, lawsuits, allegations of misconduct, even from officials or official documents"

format:
  description: format.md
  aspect: "9:16"
  # Проба владельца с 13.11.2026: ролики 55–60 с вместо 45–90 (format.md, «Длительность и темп»). Сценарий — не длиннее
  # 60 с; max 65 — запас на темп голоса: 60 с по бюджету 2,3 — это 138 слов, на медленном конце (2,2 слова/с) 62,7 с.
  # Вернуть 90 — одной строкой здесь и в format.md.
  duration_s: { min: 45, max: 65 }
  # Все голоса на скорости 1,0 (выбор владельца 04.11.2026). Темп сильно зависит от текста: по 9 роликам 05–12.11
  # голос с паузами читал 2,2–2,7 слова в секунду, медиана 2,4 (format.md, «Длительность и темп»). Бюджет 2,3 —
  # ниже медианы, чтобы сценарий не выходил за предел. Минимум — по быстрому концу: 122 слова на 2,7 слова/с — это 45 с
  # (было 135, при 60-секундном потолке оставалось бы 135–138 слов).
  words: { rate: 2.3, min: 122, seconds_per_word: 0.40, serious_rate: 2.05, serious_min: 113, serious_seconds_per_word: 0.45 }
  templates: [nes-desk]
  default_template: nes-desk
  # Голос у каждого ведущего свой: voice_id в studio/channels/8bitnews-es/anchors/<id>/manifest.json.
  voice: { provider: kokoro }
  subtitles: burned_in

sources: countries/es/sources.yaml
policy: countries/es/policy.md

experiments:
  enabled: true
  # Владелец 18.11.2026: проба «без музыки». За 05–16.11 лента Shorts продвинула все 5 роликов в серьёзном режиме
  # (без музыки) и 9 из 39 остальных, но серьёзный режим ставится на тяжёлые события, так что тему от подачи не
  # отделить. С 19.11 по 02.12 (UTC) половина роликов, где сценарий просит музыку, собирается без неё: группу решает
  # хеш досье сюжета: доработка сценария или ролика оставляет его в группе, новое досье (возврат в Research) может
  # сменить её (studio/studio/experiments.py). Группа — в пакете ролика
  # (`experiment.arm`: "on" с музыкой, "off" без). Ролик длиннее 60 с уходит на YouTube без музыки в любой группе
  # (`video_no_music`), поэтому в разборе такие ролики считаются отдельно. Метрика: просмотры из ленты Shorts
  # и вовлечённые просмотры за 48 ч. Первый взгляд через неделю. Закончить — убрать `music_off` и вернуть `enabled: false`.
  music_off: { from: "2026-11-19", until: "2026-12-02" }
