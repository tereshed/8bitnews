# Профиль канала. Черновик: значения tbd заполняются в эпиках E2–E4.
# Схема описана в docs/architecture.md §10; валидатор появится в E0.

id: 8bitnews-us
name: 8BitNewsUS
country: US
language: en-US
timezone: America/New_York

platforms:
  youtube:   { enabled: true, account: "@8BitNewsUS" }
  # Владелец 09.11.2026: пока только YouTube. Аккаунтов TikTok и Instagram нет, Legal их правила не проверяет.
  tiktok:    { enabled: false, account: tbd }
  instagram: { enabled: false, account: tbd }

schedule:
  # Запуски конвейера в PolyMaths (cron в timezone канала). Один запуск = один ролик.
  # 09:00 по Нью-Йорку: editor уже видит утренние данные (BLS, CPI выходят в 8:30). 18:00 NY — вечерний пик Shorts/TikTok и 15:00 на западе.
  # Владелец 07.11.2026: сбор в это время; ролик выходит в слот через расписание YouTube.
  runs: ["0 9 * * *"]
  # Слоты публикации (локальное время канала). Первый — основной; второй, 12:00 по Нью-Йорку (18:00 в Мадриде), — на дни, когда роликов больше одного.
  publish_slots: ["18:00", "12:00"]

moderation:
  # Владелец 09.11.2026: подтверждать каждый ролик не нужно, готовый сразу встаёт в расписание (docs/automation.md).
  approval_required: false

editorial:
  tone: calm, neutral, analytical; serious mode for deaths, violence and disasters (format.md)
  topics_include: []
  topics_exclude: []

format:
  description: format.md
  aspect: "9:16"
  duration_s: { min: 45, max: 90 }
  words: { rate: 2.2, min: 110, seconds_per_word: 0.42, serious_rate: 2.0, serious_min: 100, serious_seconds_per_word: 0.46 }
  # Стартовые шаблоны из репозитория. Дальше шаблоны живут в библиотеке hub: команда Design добавляет новый
  # раз в 3 дня, hub подбирает шаблон под ролик (docs/architecture.md §5, «Шаблоны»). default_template — запасной.
  templates: [nes-desk]
  default_template: nes-desk
  # Голос у каждого ведущего свой: voice_id в studio/channels/8bitnews-us/anchors/<id>/manifest.json
  # (format.md, «Ведущие»; ведущие и голоса — выбор владельца 28.10). Все голоса подогнаны к темпу около
  # 144 слов в минуту (своя скорость у каждого, studio/config.json tts.kokoro.voices): под этот темп
  # откалиброван бюджет слов format.md.
  voice: { provider: kokoro }
  subtitles: burned_in

sources: countries/us/sources.yaml
policy: countries/us/policy.md

experiments:
  enabled: false
