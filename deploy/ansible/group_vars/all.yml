---
# Shared vars. Anything with no safe default is read from the Ansible
# controller's environment and must never be hardcoded or committed — see
# deploy/ansible/deploy.env.example for the full list a human needs to
# export before running `make deploy-*`.
hub_server_host: "{{ lookup('env', 'HUB_SERVER_HOST') | default('135.181.4.110', true) }}"

# Private keys from the controller's environment — never hardcoded or
# committed. HUB_SERVER_SSH_KEY authenticates root@hub_server_host (both
# directly, for the hub_host group, and as the -i key of the ProxyCommand
# hop used to reach the guest — see group_vars/hub_guest.yml).
# HUB_ADMIN_SSH_KEY authenticates the guest's own admin user; its *public*
# half is derived on the fly in hub_vm.yml (ssh-keygen -y) and injected via
# cloud-init, so only one key needs to be kept in a secret store.
hub_server_ssh_key: "{{ lookup('env', 'HUB_SERVER_SSH_KEY') }}"
hub_admin_ssh_key: "{{ lookup('env', 'HUB_ADMIN_SSH_KEY') }}"

# Domain the hub is published under (Caddy site + Cloudflare DNS record).
# hub_domain already points at 135.181.4.110 in Cloudflare ("DNS only") as
# hub.8bitlang.org — that's the default; HUB_DOMAIN only needs to be set
# to override it (e.g. for a different environment).
hub_domain: "{{ lookup('env', 'HUB_DOMAIN') | default('hub.8bitlang.org', true) }}"

# Git ref of github.com/tereshed/8bitnews checked out on the guest.
# `make deploy-hub REF=<ref>` overrides HUB_REF for one run.
hub_ref: "{{ lookup('env', 'HUB_REF') | default('main', true) }}"
hub_repo_url: "https://github.com/tereshed/8bitnews.git"

# Cloudflare R2, EU jurisdiction (endpoint shape:
# https://<account_id>.eu.r2.cloudflarestorage.com). One token/credential
# pair scoped to both buckets, two bucket names — all from the
# controller's environment, never hardcoded or committed.
r2_endpoint: "{{ lookup('env', 'R2_ENDPOINT') }}"
r2_access_key_id: "{{ lookup('env', 'R2_ACCESS_KEY_ID') }}"
r2_secret_access_key: "{{ lookup('env', 'R2_SECRET_ACCESS_KEY') }}"
r2_media_bucket: "{{ lookup('env', 'R2_MEDIA_BUCKET') }}"
r2_backup_bucket: "{{ lookup('env', 'R2_BACKUP_BUCKET') }}"

# The Telegram moderation bot and its group (E4); an empty token leaves the
# bot off and releases stay "submitted".
telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
telegram_moderation_chat_id: "{{ lookup('env', 'TELEGRAM_MODERATION_CHAT_ID') }}"

# The publication package (E4): hub serves each video's sources page and the
# channel's list of videos at this address (the Caddy site above proxies
# them); HUB_PUBLIC_URL overrides it. The corrections contact goes into every
# description and sources page; empty, the package flags it as missing.
hub_public_url: "{{ lookup('env', 'HUB_PUBLIC_URL') | default('https://' ~ hub_domain, true) }}"
hub_corrections_contact: "{{ lookup('env', 'HUB_CORRECTIONS_CONTACT') }}"

# The public costs page reads each run's tokens from PolyMaths. The key must be
# a viewer's, never the owner's; empty, the page shows only the pictures' cost.
hub_polymaths_api_key: "{{ lookup('env', 'HUB_POLYMATHS_API_KEY') }}"
hub_polymaths_project_id: dc720749-e93f-4078-b7fc-d5a3193eefc3
hub_polymaths_newsroom_team_id: 4952c227-94ab-4391-90a8-76ff59e41dfb

# hub's own S3 env names (internal/config/config.go's HUB_S3_* contract);
# mapped from the r2_* controller vars above, not read from the
# environment directly — the app doesn't need to know these are R2.
hub_s3_endpoint: "{{ r2_endpoint }}"
hub_s3_bucket: "{{ r2_media_bucket }}"
hub_s3_access_key: "{{ r2_access_key_id }}"
hub_s3_secret_key: "{{ r2_secret_access_key }}"
hub_s3_region: auto

# hub's own listen port inside the guest; shared between the host's
# qemu hostfwd target and the guest's compose/healthz tasks.
hub_guest_http_port: 8080

# qemu hostfwd ports on the host's loopback only (task E1d AC3): SSH for
# Ansible/operator access, HTTP for Caddy's reverse_proxy. Shared, not
# hub_host-only: the hub_guest inventory entry connects through the SSH one.
hub_vm_ssh_port: 2223
hub_vm_http_port: 9201

# The guest VM's only login user: created by cloud-init on the host side
# (hub_vm.yml) and used as ansible_user by the hub_guest inventory entry.
hub_admin_user: bitnews

# Optional moderator rework dispatcher (kept off without credentials).
hub_polymaths_url: "{{ lookup('env', 'HUB_POLYMATHS_URL') | default('https://polymaths.work/api/v1', true) }}"
hub_polymaths_write_api_key: "{{ lookup('env', 'HUB_POLYMATHS_WRITE_API_KEY') | default('', true) }}"
hub_publisher_api_key: "{{ lookup('env', 'HUB_PUBLISHER_API_KEY') | default('', true) }}"
hub_youtube_client_id: "{{ lookup('env', 'HUB_YOUTUBE_CLIENT_ID') | default('', true) }}"
hub_youtube_client_secret: "{{ lookup('env', 'HUB_YOUTUBE_CLIENT_SECRET') | default('', true) }}"
hub_youtube_token_key: "{{ lookup('env', 'HUB_YOUTUBE_TOKEN_KEY') | default('', true) }}"
