---
# Two groups for one physical server: hub_host is the Hetzner box itself
# (root over plain SSH); hub_guest is the isolated KVM VM, which never
# listens on anything but 127.0.0.1 on the host — every connection to it,
# Ansible's included, goes through hub_host via ProxyCommand (task E1d:
# "доступ к гостю — SSH через хост"). See group_vars/hub_guest.yml for the
# jump config.
all:
  children:
    hub_host:
      hosts:
        server:
          ansible_host: "{{ hub_server_host }}"
          ansible_user: root
          ansible_ssh_private_key_file: "{{ hub_server_ssh_key }}"
    hub_guest:
      hosts:
        vm:
          ansible_host: 127.0.0.1
          ansible_port: "{{ hub_vm_ssh_port }}"
          ansible_user: "{{ hub_admin_user }}"
          ansible_ssh_private_key_file: "{{ hub_admin_ssh_key }}"
          ansible_ssh_common_args: "{{ hub_guest_ssh_proxy_args }}"
