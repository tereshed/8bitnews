# Источники для каналов страны ES. Стартовый список — расширяется по ходу работы.
# leaning — ориентировочная позиция редакции в испанском спектре, а не истина: агенты используют её, чтобы покрыть
# весь спектр, а не чтобы оценивать материалы. Общепринятого рейтинга, как в США, у испанской прессы нет: разметка —
# по самоописанию изданий и исследованиям аудитории; её можно уточнять.
# Издания с выраженной позицией (left, right) представляют позицию своей стороны; факт подтверждай ещё и источником
# без такой позиции или первоисточником. Правило одно для обеих сторон.
# ownership: private | public_broadcaster | state_funded | state_controlled
#   state_funded — государство — владелец или главный акционер издания, или основной доход издания — прямо из
#   госбюджета (EFE, RTVE, DW, France 24). Владение решает и при целевом сборе (RTVE). state_controlled — то же, и
#   есть источник, что правительство управляет редакцией (TASS, Xinhua). public_broadcaster — общественное вещание,
#   которым государство не владеет как акционер, на свой целевой сбор (BBC, NHK). Разовые или частичные платежи
#   государства издание государственным не делают (AFP — private).
#   «Государство» здесь — центральная власть страны издания. Вещатель правительства автономии или региона (RTVC,
#   Telemadrid, 3Cat, Canal Sur, EITB, À Punt, CRTVG, IB3) — не state_* и не «(medio estatal)»: по-испански «estatal» —
#   это государство Испания. В тексте называй, чей он: «RTVC, la radiotelevisión pública del Gobierno de Canarias»;
#   в досье — «public broadcaster of the Canary Islands Government».
#   Издания нет в списке — классифицируй по тому же правилу и по источнику о владельце или финансировании.
# paywall: true — большинство материалов за платным или лимитированным доступом. В списках источников hub помечает
# такие ссылки «(de pago)», а state_funded и state_controlled — «(medio estatal)» (policy.md, «Источники в ролике»).
# news_sitemap — лента свежих материалов издания с прямыми ссылками. WebSearch для большинства испанских доменов не
# работает, поэтому local_press_analyst ищет материалы по сюжету grep'ом по этой ленте (проверено 10.11.2026: лента
# отвечает, статья проходит source_check). У изданий без поля пригодной ленты нет или их статьи hub не принимает.

country: ES
language: es-ES

