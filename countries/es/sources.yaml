# Источники для каналов страны ES. Стартовый список — расширяется по ходу работы.
# leaning — ориентировочная позиция редакции в испанском спектре, а не истина: агенты используют её, чтобы покрыть
# весь спектр, а не чтобы оценивать материалы. Общепринятого рейтинга, как в США, у испанской прессы нет: разметка —
# по самоописанию изданий и исследованиям аудитории; её можно уточнять.
# Издания с выраженной позицией (left, right) представляют позицию своей стороны; факт подтверждай ещё и источником
# без такой позиции или первоисточником. Правило одно для обеих сторон.
# ownership: private | public_broadcaster | state_funded | state_controlled
# paywall: true — большинство материалов за платным или лимитированным доступом. В списках источников hub помечает
# такие ссылки «(de pago)», а state_funded и state_controlled — «(medio estatal)» (policy.md, «Источники в ролике»).

country: ES
language: es-ES

local:
  # агентства и общественное вещание
  # aka: имена, под которыми издание идёт на чужих сайтах («EFE (via Infobae)»): пометка hub держится и на них.
  - { outlet: Agencia EFE, domain: efe.com, kind: wire, leaning: center, ownership: state_funded, aka: [EFE, Agencia EFE], note: "государственная компания" }
  - { outlet: EFE Verde, domain: efeverde.com, kind: wire, leaning: center, ownership: state_funded, note: "экологическая служба EFE" }
  - { outlet: Europa Press, domain: europapress.es, kind: wire, leaning: center }
  - { outlet: RTVE, domain: rtve.es, kind: press, leaning: center, ownership: state_funded, note: "руководство избирают Cortes; баланс меняется с большинством" }
  # центр и деловые
  - { outlet: La Vanguardia, domain: lavanguardia.com, kind: press, leaning: center, note: "Барселона, взгляд из Каталонии" }
  - { outlet: El Confidencial, domain: elconfidencial.com, kind: press, leaning: center }
  - { outlet: 20minutos, domain: 20minutos.es, kind: press, leaning: center }
  - { outlet: Expansión, domain: expansion.com, kind: press, leaning: center, paywall: true, note: "деловая" }
  - { outlet: Cinco Días, domain: cincodias.elpais.com, kind: press, leaning: center, paywall: true, note: "деловая, группа Prisa" }
  - { outlet: La Voz de Galicia, domain: lavozdegalicia.es, kind: press, leaning: center, note: "региональная" }
  # левее центра
  - { outlet: El País, domain: elpais.com, kind: press, leaning: lean_left, paywall: true }
  - { outlet: Cadena SER, domain: cadenaser.com, kind: press, leaning: lean_left }
  - { outlet: laSexta, domain: lasexta.com, kind: press, leaning: lean_left }
  - { outlet: El Periódico, domain: elperiodico.com, kind: press, leaning: lean_left }
  - { outlet: elDiario.es, domain: eldiario.es, kind: press, leaning: left }
  - { outlet: infoLibre, domain: infolibre.es, kind: press, leaning: left }
  - { outlet: Público, domain: publico.es, kind: press, leaning: left }
  # правее центра
  - { outlet: El Mundo, domain: elmundo.es, kind: press, leaning: lean_right, paywall: true }
  - { outlet: ABC, domain: abc.es, kind: press, leaning: lean_right, paywall: true }
  - { outlet: El Español, domain: elespanol.com, kind: press, leaning: lean_right }
  - { outlet: Antena 3 Noticias, domain: antena3.com, kind: press, leaning: lean_right }
  - { outlet: Onda Cero, domain: ondacero.es, kind: press, leaning: lean_right }
  - { outlet: COPE, domain: cope.es, kind: press, leaning: lean_right }
  - { outlet: La Razón, domain: larazon.es, kind: press, leaning: right }
  - { outlet: Libertad Digital, domain: libertaddigital.com, kind: press, leaning: right }
  - { outlet: The Objective, domain: theobjective.com, kind: press, leaning: right }
  - { outlet: OKdiario, domain: okdiario.com, kind: press, leaning: right }
  # взгляд из автономий: сюжеты о Каталонии и Стране Басков сверяем с местной прессой
  - { outlet: Ara, domain: ara.cat, kind: press, language: ca, note: "Каталония, каталонский язык", paywall: true }
  - { outlet: El Correo, domain: elcorreo.com, kind: press, leaning: center, note: "Страна Басков", paywall: true }
  - { outlet: Deia, domain: deia.eus, kind: press, note: "Страна Басков, близка к баскским националистам" }
  - { outlet: Naiz, domain: naiz.eus, kind: press, leaning: left, note: "Страна Басков, левые абертцале" }

