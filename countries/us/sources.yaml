# Источники для каналов страны US. Стартовый список — расширяется по ходу работы.
# leaning — ориентировочная позиция редакции в американском спектре (по открытым рейтингам медиа-предвзятости),
# а не истина: агенты используют её, чтобы покрыть весь спектр, а не чтобы оценивать материалы.
# ownership: private | public_broadcaster | state_funded | state_controlled

country: US
language: en-US

local:
  # агентства и деловые
  - { outlet: Associated Press, domain: apnews.com, kind: wire, leaning: center }
  - { outlet: Reuters, domain: reuters.com, kind: wire, leaning: center }
  - { outlet: Bloomberg, domain: bloomberg.com, kind: press, leaning: center }
  - { outlet: The Wall Street Journal, domain: wsj.com, kind: press, leaning: center, note: "редакция новостей — центр, редакционная полоса — правее" }
  - { outlet: Axios, domain: axios.com, kind: press, leaning: center }
  - { outlet: The Hill, domain: thehill.com, kind: press, leaning: center }
  # левее центра
  - { outlet: The New York Times, domain: nytimes.com, kind: press, leaning: lean_left }
  - { outlet: The Washington Post, domain: washingtonpost.com, kind: press, leaning: lean_left }
  - { outlet: CNN, domain: cnn.com, kind: press, leaning: lean_left }
  - { outlet: NPR, domain: npr.org, kind: press, leaning: lean_left }
  - { outlet: NBC News, domain: nbcnews.com, kind: press, leaning: lean_left }
  - { outlet: Politico, domain: politico.com, kind: press, leaning: lean_left }
  - { outlet: MSNBC, domain: msnbc.com, kind: press, leaning: left }
  - { outlet: Vox, domain: vox.com, kind: press, leaning: left }
  - { outlet: HuffPost, domain: huffpost.com, kind: press, leaning: left }
  # правее центра
  - { outlet: New York Post, domain: nypost.com, kind: press, leaning: lean_right }
  - { outlet: Washington Examiner, domain: washingtonexaminer.com, kind: press, leaning: lean_right }
  - { outlet: The Free Press, domain: thefp.com, kind: press, leaning: lean_right }
  - { outlet: The Dispatch, domain: thedispatch.com, kind: press, leaning: lean_right }
  - { outlet: Reason, domain: reason.com, kind: press, leaning: lean_right, note: "либертарианская позиция" }
  - { outlet: Fox News, domain: foxnews.com, kind: press, leaning: right }
  - { outlet: National Review, domain: nationalreview.com, kind: press, leaning: right }
  - { outlet: The Daily Wire, domain: dailywire.com, kind: press, leaning: right }
  - { outlet: The Federalist, domain: thefederalist.com, kind: press, leaning: right }

